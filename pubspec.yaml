publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
